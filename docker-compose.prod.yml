# =============================================================
# InfraPilot Production - Multi-Container Deployment
# =============================================================
#
# Production deployment with separate services:
# - PostgreSQL (official image)
# - Redis (official image)
# - Nginx (official image, managed by agent)
# - Backend (InfraPilot API)
# - Frontend (InfraPilot Dashboard)
# - Agent (InfraPilot Host Controller)
#
# Quick Start:
#   cp .env.example .env
#   # Edit .env with your configuration
#   docker compose -f docker-compose.prod.yml up -d
#
# Dashboard: http://localhost (or your domain)
#
# =============================================================

services:
  # =============================================================
  # PostgreSQL Database
  # =============================================================
  postgres:
    image: postgres:16-alpine
    container_name: infrapilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infrapilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-infrapilot}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrapilot}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrapilot

  # =============================================================
  # Redis Cache & Session Store
  # =============================================================
  redis:
    image: redis:7-alpine
    container_name: infrapilot-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrapilot

  # =============================================================
  # Backend API Server
  # =============================================================
  backend:
    image: infrapilothq/infrapilot-ce-backend:${VERSION:-latest}
    build:
      context: ./backend
      dockerfile: ../deployments/backend.Dockerfile
    container_name: infrapilot-backend
    restart: unless-stopped
    environment:
      ENV: production
      HTTP_PORT: 8080
      GRPC_PORT: 9090

      # Required
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}

      # Database
      DATABASE_URL: postgres://${POSTGRES_USER:-infrapilot}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infrapilot}?sslmode=disable

      # Redis
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,https://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - infrapilot

  # =============================================================
  # Frontend Dashboard
  # =============================================================
  frontend:
    image: infrapilothq/infrapilot-ce-frontend:${VERSION:-latest}
    build:
      context: ./frontend
      dockerfile: ../deployments/frontend.Dockerfile
    container_name: infrapilot-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: /api/v1
    depends_on:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    networks:
      - infrapilot

  # =============================================================
  # Nginx Reverse Proxy (Managed by Agent)
  # =============================================================
  nginx:
    image: nginx:stable-alpine
    container_name: infrapilot-nginx
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - nginx_conf:/etc/nginx/sites
      - nginx_certs:/etc/letsencrypt
      - acme_webroot:/var/www/acme-challenge
    depends_on:
      - frontend
      - backend
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - infrapilot

  # =============================================================
  # Agent - Docker & Nginx Controller
  # =============================================================
  agent:
    image: infrapilothq/infrapilot-ce-agent:${VERSION:-latest}
    build:
      context: ./agent
      dockerfile: ../deployments/agent.Dockerfile
    container_name: infrapilot-agent
    restart: unless-stopped
    environment:
      # Agent Configuration
      AGENT_ID: ${AGENT_ID:-00000000-0000-0000-0000-000000000001}
      BACKEND_GRPC_ADDR: backend:9090
      BACKEND_HTTP_URL: http://backend:8080

      # Nginx Management
      NGINX_CONTAINER_NAME: infrapilot-nginx
      NGINX_CONFIG_PATH: /etc/nginx/sites
      PROXY_MODE: managed

      # SSL/ACME
      ACME_WEBROOT: /var/www/acme-challenge
      CERT_DIR: /etc/letsencrypt
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:-}
      LETSENCRYPT_STAGING: ${LETSENCRYPT_STAGING:-true}

      # Data persistence
      DATA_DIR: /var/lib/infrapilot-agent
      LOG_PERSISTENCE: "true"
    volumes:
      # Docker socket for container management
      - /var/run/docker.sock:/var/run/docker.sock

      # Shared with Nginx
      - nginx_conf:/etc/nginx/sites
      - nginx_certs:/etc/letsencrypt
      - acme_webroot:/var/www/acme-challenge

      # Agent data
      - agent_data:/var/lib/infrapilot-agent
    depends_on:
      - backend
      - nginx
    networks:
      - infrapilot

# =============================================================
# Networks
# =============================================================
networks:
  infrapilot:
    driver: bridge

# =============================================================
# Volumes
# =============================================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  nginx_conf:
    driver: local
  nginx_certs:
    driver: local
  acme_webroot:
    driver: local
  agent_data:
    driver: local
