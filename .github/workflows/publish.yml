name: Publish images

# Builds the backend, frontend, agent and all-in-one images and pushes them to
# GHCR (ghcr.io/infrapilothq/infrapilot-ce-*). These images are PUBLIC.
#
# Triggers:
#   - push to main          -> tagged `latest`
#   - push of a v* git tag  -> tagged with the version (and `latest`)
#   - manual dispatch       -> tagged with the supplied version
#
# Docker Hub is intentionally skipped in CI (PUSH_DOCKERHUB=false); the runner
# only authenticates to GHCR via the built-in GITHUB_TOKEN.

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to publish"
        required: true
        default: latest

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "version=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build & push to GHCR
        env:
          PUSH_DOCKERHUB: "false"
        run: ./scripts/build-and-publish.sh "${{ steps.ver.outputs.version }}"
